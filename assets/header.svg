<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="H M Shahadul Islam — Full-Stack WordPress Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#17113a"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c4b5ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <circle cx="180" cy="80" r="150" fill="#7c5cff" opacity="0.55" filter="url(#blur)">
      <animate attributeName="cx" values="180;320;180" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="270" r="170" fill="#22d3ee" opacity="0.38" filter="url(#blur)">
      <animate attributeName="cy" values="270;160;270" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="330" r="110" fill="#ff7ab6" opacity="0.28" filter="url(#blur)">
      <animate attributeName="cx" values="640;780;640" dur="10s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="340" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- status pill -->
  <g transform="translate(64 52)">
    <rect width="262" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="20" cy="17" r="5" fill="#34d399">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="17" r="5" fill="none" stroke="#34d399">
      <animate attributeName="r" values="5;14" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="22" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#c9d1f2" letter-spacing="0.4">open for new projects</text>
  </g>

  <!-- name -->
  <text x="64" y="162" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="70" font-weight="800" fill="url(#name)" letter-spacing="-2">H M Shahadul Islam</text>
  <text x="66" y="206" font-family="'Segoe UI',Inter,system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="500" fill="#9aa4c7">Full-Stack WordPress Developer · ThemeForest Author</text>

  <!-- rotating roles -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21">
    <text x="66" y="262" fill="#7c5cff" font-weight="700">&gt;</text>
    <text x="92" y="262" fill="#e7e9ff">
      building fast, secure WordPress products
      <animate attributeName="opacity" values="0;1;1;0;0;0;0;0;0" keyTimes="0;0.04;0.28;0.33;0.34;0.66;0.67;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="92" y="262" fill="#e7e9ff">
      turning PSDs into pixel-perfect themes
      <animate attributeName="opacity" values="0;0;0;1;1;0;0;0;0" keyTimes="0;0.33;0.34;0.38;0.61;0.66;0.67;0.99;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="92" y="262" fill="#e7e9ff">
      exploring headless WordPress &amp; APIs
      <animate attributeName="opacity" values="0;0;0;0;0;0;1;1;0" keyTimes="0;0.33;0.66;0.67;0.7;0.71;0.74;0.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <rect x="92" y="244" width="2" height="24" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- emblem -->
  <g transform="translate(1000 170)">
    <circle r="96" fill="none" stroke="url(#ring)" stroke-width="2" stroke-dasharray="4 10" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle r="72" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle r="58" fill="#0a0e1a" fill-opacity="0.7" stroke="url(#ring)" stroke-width="2"/>
    <text y="14" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="40" font-weight="700" fill="url(#name)">&lt;/&gt;</text>
    <circle r="5" fill="#22d3ee">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="96;96" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
