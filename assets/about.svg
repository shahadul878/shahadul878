<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="About H M Shahadul Islam as a code snippet">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11162a"/>
      <stop offset="1" stop-color="#0b0f1d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:20px}
    .n{fill:#4a5378}
    .k{fill:#c4b5ff}
    .v{fill:#7dd3fc}
    .s{fill:#fcd34d}
    .p{fill:#e7e9ff}
    .c{fill:#5b6690;font-style:italic}
    .l{opacity:0}
  </style>
  <rect x="2" y="2" width="1196" height="426" rx="18" fill="url(#glow)" opacity="0.5"/>
  <rect x="3" y="3" width="1194" height="424" rx="17" fill="url(#win)"/>
  <rect x="3" y="3" width="1194" height="52" rx="17" fill="#ffffff" fill-opacity="0.04"/>
  <circle cx="34" cy="29" r="7" fill="#ff5f57"/><circle cx="58" cy="29" r="7" fill="#febc2e"/><circle cx="82" cy="29" r="7" fill="#28c840"/>
  <text x="600" y="35" text-anchor="middle" class="m" style="font-size:15px" fill="#8b95bd">shahadul.ts — codereyes</text>

  <g class="m" transform="translate(0 92)">
    <g class="l"><text x="34" y="0" class="n">1</text><text x="80" y="0"><tspan class="c">// who am i</tspan></text><animate attributeName="opacity" to="1" begin="0.2s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="34" y="30" class="n">2</text><text x="80" y="30" xml:space="preserve"><tspan class="k">const</tspan> <tspan class="v">shahadul</tspan> <tspan class="p">= {</tspan></text><animate attributeName="opacity" to="1" begin="0.5s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="34" y="60" class="n">3</text><text x="80" y="60" xml:space="preserve"><tspan class="p">  role:</tspan>        <tspan class="s">"Lead Developer &amp; Maintenance Engineer"</tspan><tspan class="p">,</tspan></text><animate attributeName="opacity" to="1" begin="0.8s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="34" y="90" class="n">4</text><text x="80" y="90" xml:space="preserve"><tspan class="p">  experience:</tspan>  <tspan class="s">"7+ years"</tspan><tspan class="p">,</tspan></text><animate attributeName="opacity" to="1" begin="1.1s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="34" y="120" class="n">5</text><text x="80" y="120" xml:space="preserve"><tspan class="p">  craft:</tspan>       <tspan class="p">[</tspan><tspan class="s">"themes"</tspan><tspan class="p">, </tspan><tspan class="s">"plugins"</tspan><tspan class="p">, </tspan><tspan class="s">"WooCommerce"</tspan><tspan class="p">, </tspan><tspan class="s">"DevOps"</tspan><tspan class="p">, </tspan><tspan class="s">"SaaS &amp; APIs"</tspan><tspan class="p">, </tspan><tspan class="s">"Figma → WP"</tspan><tspan class="p">],</tspan></text><animate attributeName="opacity" to="1" begin="1.4s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="34" y="150" class="n">6</text><text x="80" y="150" xml:space="preserve"><tspan class="p">  shipping:</tspan>    <tspan class="s">"Easy PHP Settings · 2,000+ active installs"</tspan><tspan class="p">,</tspan></text><animate attributeName="opacity" to="1" begin="1.7s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="34" y="180" class="n">7</text><text x="80" y="180" xml:space="preserve"><tspan class="p">  exploring:</tspan>   <tspan class="p">[</tspan><tspan class="s">"Headless WordPress"</tspan><tspan class="p">, </tspan><tspan class="s">"API integrations"</tspan><tspan class="p">],</tspan></text><animate attributeName="opacity" to="1" begin="2s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="34" y="210" class="n">8</text><text x="80" y="210" xml:space="preserve"><tspan class="p">  philosophy:</tspan>  <tspan class="s">"Clean, efficient code = a secure, fast web"</tspan><tspan class="p">,</tspan></text><animate attributeName="opacity" to="1" begin="2.3s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="34" y="240" class="n">9</text><text x="80" y="240" xml:space="preserve"><tspan class="p">  team:</tspan>        <tspan class="s">"building ThemeForest themes with a company team"</tspan><tspan class="p">,</tspan></text><animate attributeName="opacity" to="1" begin="2.6s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="26" y="270" class="n" style="font-size:20px">10</text><text x="80" y="270"><tspan class="p">};</tspan></text><animate attributeName="opacity" to="1" begin="2.9s" dur="0.3s" fill="freeze"/></g>
    <g class="l"><text x="26" y="320" class="n">11</text><text x="80" y="320" xml:space="preserve"><tspan class="k">export default</tspan> <tspan class="v">shahadul</tspan><tspan class="p">;</tspan></text><animate attributeName="opacity" to="1" begin="3.2s" dur="0.3s" fill="freeze"/></g>
    <rect x="80" y="338" width="11" height="3" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
